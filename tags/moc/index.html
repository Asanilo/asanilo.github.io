    document.addEventListener("mousemove", (e) => {

                el.dataset.cursorBound = true;

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const wikiLinks = Array.from(document.querySelectorAll('a.wikilink[href]')).filter((link) => {
            const href = (link.getAttribute("href") || "").trim();
            return href && !/^(?:[a-z]+:|\/|#)/i.test(href);
        });

        if (wikiLinks.length === 0) {
            return;
        }

        const indexUrl = "\"https://www.asanilo.top/index.json\"";
        const stripHashAndQuery = (value) => value.replace(/[?#].*$/, "");
        const normalizeKey = (value) => decodeURIComponent(String(value || ""))
            .trim()
            .replace(/^\.\//, "")
            .replace(/\.md$/i, "")
            .replace(/^\/+|\/+$/g, "")
            .replace(/\s+/g, " ")
            .toLowerCase();
        const slugKey = (value) => normalizeKey(value)
            .replace(/["'.,!?()[\]{}]/g, "")
            .replace(/[\s_]+/g, "-")
            .replace(/-+/g, "-");
        const decodedPathSegment = (value) => {
            const cleanValue = stripHashAndQuery(String(value || "")).replace(/\/+$/g, "");
            const segment = cleanValue.split("/").filter(Boolean).pop() || "";
            return decodeURIComponent(segment);
        };
        const siblingGuess = (href) => {
            const cleanHref = stripHashAndQuery(String(href || "")).replace(/^\.\//, "").replace(/^\/+|\/+$/g, "");
            if (!cleanHref) {
                return null;
            }
            const encodedPath = cleanHref
                .split("/")
                .filter(Boolean)
                .map((segment) => encodeURIComponent(segment))
                .join("/");
            return new URL(`../${encodedPath}/`, window.location.href).pathname;
        };

        const linkMap = new Map();
        const addCandidate = (key, permalink) => {
            const normalized = normalizeKey(key);
            if (normalized && !linkMap.has(normalized)) {
                linkMap.set(normalized, permalink);
            }
            const slugified = slugKey(key);
            if (slugified && !linkMap.has(slugified)) {
                linkMap.set(slugified, permalink);
            }
        };
        const resolveCandidate = (value) => {
            const normalized = normalizeKey(value);
            if (normalized && linkMap.has(normalized)) {
                return linkMap.get(normalized);
            }
            const slugified = slugKey(value);
            if (slugified && linkMap.has(slugified)) {
                return linkMap.get(slugified);
            }
            return null;
        };

        fetch(indexUrl)
            .then((response) => response.ok ? response.json() : Promise.reject(new Error(`Failed to load ${indexUrl}`)))
            .then((pages) => {
                pages.forEach((page) => {
                    if (!page || page.type !== "posts" || !page.permalink) {
                        return;
                    }
                    addCandidate(page.title, page.permalink);
                    addCandidate(decodedPathSegment(page.permalink), page.permalink);
                });

                wikiLinks.forEach((link) => {
                    const rawHref = link.getAttribute("href") || "";
                    const resolvedHref = resolveCandidate(rawHref) || resolveCandidate(link.textContent) || resolveCandidate(decodedPathSegment(rawHref));

                    if (resolvedHref) {
                        link.setAttribute("href", resolvedHref);
                        return;
                    }

                    const guessedHref = siblingGuess(rawHref);
                    if (guessedHref) {
                        link.setAttribute("href", guessedHref);
                        link.setAttribute("data-wikilink-fallback", "true");
                    }
                });
            })
            .catch(() => {
                wikiLinks.forEach((link) => {
                    const guessedHref = siblingGuess(link.getAttribute("href") || "");
                    if (guessedHref) {
                        link.setAttribute("href", guessedHref);
                        link.setAttribute("data-wikilink-fallback", "true");
                    }
                });
            });
    });
</script>
